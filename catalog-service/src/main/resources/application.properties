spring.application.name=catalog-service
server.port=8081

# MongoDB
spring.data.mongodb.database=catalog_db
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017

# MongoDB auditing (for createdAt / updatedAt)
spring.data.mongodb.auto-index-creation=true

# OAuth2 JWT Resource Server — set AUTH0_ISSUER_URI in your environment or docker-compose
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH0_ISSUER_URI}
