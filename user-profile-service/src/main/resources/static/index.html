<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile Service</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f7fa; color: #333; }
        .container { max-width: 900px; margin: 0 auto; padding: 24px; }
        h1 { font-size: 1.8rem; margin-bottom: 24px; color: #1a1a2e; }
        h2 { font-size: 1.2rem; margin-bottom: 12px; color: #1a1a2e; }

        .card { background: #fff; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); padding: 24px; margin-bottom: 24px; }

        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 4px; font-size: 0.9rem; }
        .form-group input { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 0.95rem; }
        .form-group input:focus { outline: none; border-color: #4361ee; box-shadow: 0 0 0 3px rgba(67,97,238,0.15); }

        .btn { padding: 10px 20px; border: none; border-radius: 6px; font-size: 0.95rem; cursor: pointer; font-weight: 600; transition: background 0.2s; }
        .btn-primary { background: #4361ee; color: #fff; }
        .btn-primary:hover { background: #3a56d4; }
        .btn-danger { background: #e63946; color: #fff; padding: 6px 14px; font-size: 0.85rem; }
        .btn-danger:hover { background: #c5303c; }
        .btn-edit { background: #f4a261; color: #fff; padding: 6px 14px; font-size: 0.85rem; }
        .btn-edit:hover { background: #e08c4a; }
        .btn-cancel { background: #adb5bd; color: #fff; margin-left: 8px; }
        .btn-cancel:hover { background: #95a0a8; }

        .btn-group { display: flex; gap: 8px; margin-top: 14px; }

        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #eee; font-size: 0.92rem; }
        th { font-weight: 600; color: #555; background: #fafafa; }
        tr:hover { background: #f8f9ff; }

        .actions { display: flex; gap: 6px; }

        .toast { position: fixed; bottom: 24px; right: 24px; padding: 14px 22px; border-radius: 8px; color: #fff; font-weight: 600; font-size: 0.9rem; opacity: 0; transition: opacity 0.3s; z-index: 100; }
        .toast.success { background: #2a9d8f; }
        .toast.error { background: #e63946; }
        .toast.show { opacity: 1; }

        .empty-state { text-align: center; padding: 40px; color: #888; }
    </style>
</head>
<body>
    <div class="container">
        <h1>User Profile Management</h1>

        <div class="card">
            <h2 id="form-title">Create New User</h2>
            <form id="user-form">
                <input type="hidden" id="user-id">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Enter username" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Enter email" required>
                </div>
                <div class="form-group">
                    <label for="tenantId">Tenant ID</label>
                    <input type="text" id="tenantId" placeholder="Enter tenant ID">
                </div>
                <div class="btn-group">
                    <button type="submit" class="btn btn-primary" id="submit-btn">Create User</button>
                    <button type="button" class="btn btn-cancel" id="cancel-btn" style="display:none" onclick="resetForm()">Cancel</button>
                </div>
            </form>
        </div>

        <div class="card">
            <h2>Users</h2>
            <div id="users-table-container">
                <div class="empty-state">Loading...</div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const API = '/api/users';

        async function fetchUsers() {
            try {
                const res = await fetch(API);
                const users = await res.json();
                renderTable(users);
            } catch (err) {
                showToast('Failed to load users', 'error');
            }
        }

        function renderTable(users) {
            const container = document.getElementById('users-table-container');
            if (users.length === 0) {
                container.innerHTML = '<div class="empty-state">No users yet. Create one above.</div>';
                return;
            }
            let html = `<table>
                <thead><tr><th>Username</th><th>Email</th><th>Tenant ID</th><th>Actions</th></tr></thead>
                <tbody>`;
            for (const u of users) {
                html += `<tr>
                    <td>${escapeHtml(u.username || '')}</td>
                    <td>${escapeHtml(u.email || '')}</td>
                    <td>${escapeHtml(u.tenantId || '')}</td>
                    <td class="actions">
                        <button class="btn btn-edit" onclick="editUser('${u.id}')">Edit</button>
                        <button class="btn btn-danger" onclick="deleteUser('${u.id}')">Delete</button>
                    </td>
                </tr>`;
            }
            html += '</tbody></table>';
            container.innerHTML = html;
        }

        document.getElementById('user-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('user-id').value;
            const body = {
                username: document.getElementById('username').value,
                email: document.getElementById('email').value,
                tenantId: document.getElementById('tenantId').value
            };

            try {
                const isEdit = !!id;
                const res = await fetch(isEdit ? `${API}/${id}` : API, {
                    method: isEdit ? 'PUT' : 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                if (!res.ok) throw new Error('Request failed');
                showToast(isEdit ? 'User updated' : 'User created', 'success');
                resetForm();
                fetchUsers();
            } catch (err) {
                showToast('Failed to save user', 'error');
            }
        });

        async function editUser(id) {
            try {
                const res = await fetch(`${API}/${id}`);
                const user = await res.json();
                document.getElementById('user-id').value = user.id;
                document.getElementById('username').value = user.username || '';
                document.getElementById('email').value = user.email || '';
                document.getElementById('tenantId').value = user.tenantId || '';
                document.getElementById('form-title').textContent = 'Edit User';
                document.getElementById('submit-btn').textContent = 'Update User';
                document.getElementById('cancel-btn').style.display = 'inline-block';
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } catch (err) {
                showToast('Failed to load user', 'error');
            }
        }

        async function deleteUser(id) {
            if (!confirm('Are you sure you want to delete this user?')) return;
            try {
                const res = await fetch(`${API}/${id}`, { method: 'DELETE' });
                if (!res.ok) throw new Error('Delete failed');
                showToast('User deleted', 'success');
                fetchUsers();
            } catch (err) {
                showToast('Failed to delete user', 'error');
            }
        }

        function resetForm() {
            document.getElementById('user-form').reset();
            document.getElementById('user-id').value = '';
            document.getElementById('form-title').textContent = 'Create New User';
            document.getElementById('submit-btn').textContent = 'Create User';
            document.getElementById('cancel-btn').style.display = 'none';
        }

        function showToast(msg, type) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = 'toast ' + type + ' show';
            setTimeout(() => { toast.className = 'toast'; }, 3000);
        }

        function escapeHtml(text) {
            const d = document.createElement('div');
            d.textContent = text;
            return d.innerHTML;
        }

        fetchUsers();
    </script>
</body>
</html>
